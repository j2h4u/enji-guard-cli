name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_LINK_MODE: hardlink

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything a PR owes release-please.  The job keeps its original id so the
  # aggregate gate below and the branch protection contexts stay stable.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate releasable PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/validate_pr_title.py --title "${PR_TITLE}"

      # The squash body is built from these subjects, so an unparseable one is
      # a changelog line release-please cannot classify.
      #
      # Bot branches are exempt.  Dependabot writes release-note bullets at
      # column 0 in its commit bodies, which is exactly what this rejects -- but
      # those bodies never reach main: a bot PR is squashed with a message
      # supplied at merge time, so the artifact being judged here is not the one
      # that lands.  The subject still has to be releasable, and it is: the
      # title check above runs for every author.
      - name: Validate PR commit subjects
        if: ${{ !startsWith(github.event.pull_request.head.ref, 'dependabot/') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -m scripts.validate_pr_commits --base-sha "${BASE_SHA}" --head-sha "${HEAD_SHA}"

      # A multi-commit PR cannot describe itself through its title alone: the
      # squash keeps one subject and drops the rest.  Demand the override block
      # release-please reads, and check it will actually parse -- a malformed
      # block collapses to a single entry with no error anywhere.
      #
      # The release PR is exempt: its body *is* the release notes, so asking it
      # for an override block describing itself is circular.  It also legitimately
      # carries more than one commit whenever an entry release-please could not
      # generate is added to it by hand.
      - name: Validate the release-note contract
        if: ${{ !startsWith(github.event.pull_request.head.ref, 'release-please--') }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          count="$(git rev-list --no-merges --count "${BASE_SHA}..${HEAD_SHA}")"
          printf '%s' "${PR_BODY}" \
            | python3 -m scripts.validate_release_notes --body-file - --commit-count "${count}"

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python-uv

      - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: just

      - name: Install dependencies
        run: uv sync --locked

      - name: Static quality gate
        run: just check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python-uv

      - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: just

      - name: Install dependencies
        run: uv sync --locked

      # This one xdist-enabled invocation is the full non-Docker suite and
      # produces the branch-coverage JSON consumed immediately by the hard
      # CRAP validator. Keeping them together avoids a second full pytest run.
      - name: Unit, branch-coverage, and CRAP gates
        run: just test-gate

  package-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python-uv

      - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: just

      - name: Install dependencies
        run: uv sync --locked

      - name: Build and test distribution artifacts
        run: |
          just package-build dist
          uv run --locked python -m scripts.package_contract dist

      - name: Upload tested distribution artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: enji-guard-cli-dist
          path: dist/*
          if-no-files-found: error

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python-uv

      - name: Install dependencies
        run: uv sync --locked

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: just

      - name: Validate compose files and Dockerfile
        run: just docker-check

      # The `docker` pytest marker is excluded from the default addopts, so
      # `just unit` in the test job never runs these.  This is the only job with
      # a Docker daemon, so it is the only place they can run in CI.
      - name: Packaging policy tests
        run: just docker-tests

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: enji-guard-cli:ci
          build-args: |
            PACKAGE_VERSION=0.0.1+sha.${{ github.sha }}
            SOURCE_COMMIT=${{ github.sha }}

      - name: Verify credentialless runtime contract
        run: uv run --locked python -m scripts.release_contract --image enji-guard-cli:ci

  ci:
    if: always()
    runs-on: ubuntu-latest
    needs: [pr-title, quality, test, package-artifact, docker-build]
    steps:
      - name: Check required jobs
        env:
          # pr-title is the only job that is skipped by design (push events).
          PR_TITLE_RESULT: ${{ needs.pr-title.result }}
          REQUIRED_RESULTS: >-
            quality:${{ needs.quality.result }}
            test:${{ needs.test.result }}
            package-artifact:${{ needs.package-artifact.result }}
            docker-build:${{ needs.docker-build.result }}
        run: |
          status=0
          for entry in ${REQUIRED_RESULTS}; do
            if [ "${entry#*:}" != "success" ]; then
              echo "::error::job ${entry%%:*} concluded ${entry#*:}"
              status=1
            fi
          done
          case "${PR_TITLE_RESULT}" in
            success | skipped) ;;
            *)
              echo "::error::job pr-title concluded ${PR_TITLE_RESULT}"
              status=1
              ;;
          esac
          exit "${status}"
