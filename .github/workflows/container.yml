name: Container

# This workflow has no trigger of its own on purpose.  It publishes to GHCR,
# and a commit must be published exactly once: two runs would build two
# different digests from the same source and race each other for `:latest` and
# for the tag the attestation subject is resolved from.  `release.yml` owns the
# push-to-main path, gates on CI, and calls this workflow; `workflow_dispatch`
# is the manual re-publish escape hatch and needs repository write access.
on:
  workflow_call:
    inputs:
      release_tag:
        description: "Release tag to publish, for example v0.2.0.  Empty publishes the sha tag only."
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish, for example v0.2.0."
        required: false
        type: string

permissions:
  contents: read

# Never cancellable: a cancellation landing between the first push and the
# attestation steps leaves promoted tags in GHCR with no provenance and no
# rollback.  Queue instead, and let the publish run to its end.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag || github.sha }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      requires-image-publish: ${{ steps.classify.outputs.requires-image-publish }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.sha }}

      - name: Classify changed files
        id: classify
        env:
          EVENT_NAME: ${{ inputs.release_tag != '' && 'release' || github.event_name }}
          HEAD_SHA: ${{ inputs.release_tag || github.sha }}
        run: |
          # CI skips quality/test/crap/docker-build on a docs-only diff yet still
          # concludes success, so this job must re-apply the same docs-only policy
          # instead of forcing a publish: otherwise a README-only commit
          # republishes an image nothing ever tested.  A release always publishes,
          # because the release commit itself only touches CHANGELOG.md.
          base_sha="$(git rev-parse --verify --quiet "${HEAD_SHA}^" || true)"
          python3 scripts/classify_changed_files.py \
            --event-name "${EVENT_NAME}" \
            --base-sha "${base_sha}" \
            --head-sha "${HEAD_SHA}" \
            --force-event release \
            --force-event workflow_dispatch \
            --output-key requires-image-publish

  publish:
    needs: [changes]
    if: needs.changes.outputs.requires-image-publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.sha }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.17"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release metadata
        id: release-metadata
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          release_tag="${INPUT_RELEASE_TAG}"
          source_sha="$(git rev-parse HEAD)"
          if [ -z "${release_tag}" ]; then
            release_tag="$(git tag --points-at "${source_sha}" --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)"
          fi
          echo "release-tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "source-sha=${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Resolve image tags
        id: image-tags
        env:
          RELEASE_TAG: ${{ steps.release-metadata.outputs.release-tag }}
          SOURCE_SHA: ${{ steps.release-metadata.outputs.source-sha }}
        run: |
          tags=("${IMAGE_NAME}:sha-${SOURCE_SHA}")
          if [[ "${RELEASE_TAG}" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            tags+=("${IMAGE_NAME}:${RELEASE_TAG}" "${IMAGE_NAME}:${RELEASE_TAG#v}")
            newest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)"
            if [ "${RELEASE_TAG}" = "${newest_tag}" ]; then
              tags+=("${IMAGE_NAME}:latest")
            else
              echo "::notice::${RELEASE_TAG} is older than ${newest_tag}; leaving :latest untouched"
            fi
          else
            echo "::notice::no release tag for ${SOURCE_SHA}; publishing the sha tag only"
          fi
          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Resolve package version
        id: package-version
        env:
          RELEASE_TAG: ${{ steps.release-metadata.outputs.release-tag }}
          SOURCE_SHA: ${{ steps.release-metadata.outputs.source-sha }}
        run: |
          if [[ "${RELEASE_TAG}" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            version="${RELEASE_TAG#v}"
          else
            version="0.0.1+sha.${SOURCE_SHA:0:12}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      # Nothing unscanned may reach the registry, so the candidate is only
      # loaded into the local daemon. Trivy scans that local image and the push
      # happens afterwards; provenance and SBOM are attested against the digest
      # the registry assigns once the scanned image has been published.
      - name: Build candidate image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: ${{ steps.image-tags.outputs.tags }}
          build-args: |
            PACKAGE_VERSION=${{ steps.package-version.outputs.version }}
            SOURCE_COMMIT=${{ steps.release-metadata.outputs.source-sha }}

      - name: Verify candidate runtime contract
        env:
          CANDIDATE: ${{ env.IMAGE_NAME }}:sha-${{ steps.release-metadata.outputs.source-sha }}
        run: |
          uv run --locked python -m scripts.release_contract --image "${CANDIDATE}"

      - name: Scan candidate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:sha-${{ steps.release-metadata.outputs.source-sha }}
          scanners: vuln
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Generate candidate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE_NAME }}:sha-${{ steps.release-metadata.outputs.source-sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # Only the immutable sha tag is pushed here.  It is the tag nobody
      # consumes by name, so if anything below fails the blast radius is one
      # orphaned, already-scanned sha tag while :latest and :X.Y.Z keep pointing
      # at the previous release.  The mutable tags are promoted further down,
      # after the attestations exist.
      - name: Publish tested image
        id: publish
        env:
          SOURCE_SHA: ${{ steps.release-metadata.outputs.source-sha }}
        run: |
          candidate="${IMAGE_NAME}:sha-${SOURCE_SHA}"
          docker push "${candidate}" | tee push.log

          # Prefer the digest the registry reported during this push.  Reading
          # it back with imagetools is only a fallback, because a transient
          # registry error there used to abort the job after the push had
          # already made the image public and before anything was attested.
          digest="$(sed -n 's/.*[[:space:]]digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' push.log | tail -n 1)"
          if [ -z "${digest}" ]; then
            digest="$(docker buildx imagetools inspect "${candidate}" --format '{{.Manifest.Digest}}')"
          fi
          if [ -z "${digest}" ]; then
            echo "::error::could not resolve the digest of ${candidate}"
            exit 1
          fi

          # The attestation subject must be the image this run built and
          # scanned, not whatever the registry currently serves under the tag.
          # A RepoDigest on the local image proves the two are the same blob.
          if ! docker image inspect "${candidate}" \
              --format '{{range .RepoDigests}}{{println .}}{{end}}' \
              | grep -qxF "${IMAGE_NAME}@${digest}"; then
            echo "::error::${digest} is not a digest of the locally scanned ${candidate}"
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      # `actions/attest-sbom` is deprecated and now only forwards to
      # `actions/attest`; call the latter directly.
      - name: Attest SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          predicate-type: https://spdx.dev/Document/v2.3
          predicate-path: sbom.spdx.json
          push-to-registry: true

      # The scanned image is already loaded locally under every tag, so each
      # push uploads the *same* manifest and every tag resolves to the digest
      # that was scanned and attested above.
      #
      # This must not use buildx imagetools retagging: that wraps the manifest
      # in a fresh index with its own digest, so the tag stops resolving to the
      # attested subject and `gh attestation verify oci://...:X.Y.Z` returns 404
      # while the attestation quietly exists on a digest nobody looks up.
      # v3.0.0 shipped exactly that.
      - name: Publish the attested digest under its consumer tags
        env:
          IMAGE_TAGS: ${{ steps.image-tags.outputs.tags }}
          SOURCE_SHA: ${{ steps.release-metadata.outputs.source-sha }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            [ "${tag}" != "${IMAGE_NAME}:sha-${SOURCE_SHA}" ] || continue
            docker push "${tag}" | tee tag-push.log
            pushed="$(sed -n 's/.*[[:space:]]digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' tag-push.log | tail -n 1)"
            if [ "${pushed}" != "${DIGEST}" ]; then
              echo "::error::${tag} resolved to ${pushed}, not the attested ${DIGEST}"
              exit 1
            fi
          done <<< "${IMAGE_TAGS}"
