name: Container

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_call:
    inputs:
      release_tag:
        description: "Release tag to publish, for example v0.2.0."
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish, for example v0.2.0."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag || github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  changes:
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.conclusion == 'success'
        )
      }}
    runs-on: ubuntu-latest
    outputs:
      requires-image-publish: ${{ steps.classify.outputs.requires-image-publish }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Classify changed files
        id: classify
        env:
          EVENT_NAME: ${{ inputs.release_tag != '' && 'release' || github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          # CI skips quality/test/crap/docker-build on a docs-only diff yet still
          # concludes success, so the workflow_run path must re-apply the same
          # docs-only policy instead of forcing a publish: otherwise a README-only
          # commit republishes an image nothing ever tested.
          base_sha="$(git rev-parse --verify --quiet "${HEAD_SHA}^" || true)"
          python3 scripts/classify_changed_files.py \
            --event-name "${EVENT_NAME}" \
            --base-sha "${base_sha}" \
            --head-sha "${HEAD_SHA}" \
            --force-event release \
            --force-event workflow_dispatch \
            --output-key requires-image-publish

  publish:
    needs: [changes]
    if: >-
      ${{
        (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
        needs.changes.outputs.requires-image-publish == 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.17"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release metadata
        id: release-metadata
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          release_tag="${INPUT_RELEASE_TAG}"
          source_sha="$(git rev-parse HEAD)"
          if [ -z "${release_tag}" ]; then
            release_tag="$(git tag --points-at "${source_sha}" --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)"
          fi
          echo "release-tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "source-sha=${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Resolve image tags
        id: image-tags
        env:
          RELEASE_TAG: ${{ steps.release-metadata.outputs.release-tag }}
          SOURCE_SHA: ${{ steps.release-metadata.outputs.source-sha }}
        run: |
          tags=("${IMAGE_NAME}:sha-${SOURCE_SHA}")
          if [[ "${RELEASE_TAG}" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            tags+=("${IMAGE_NAME}:${RELEASE_TAG}" "${IMAGE_NAME}:${RELEASE_TAG#v}")
            newest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)"
            if [ "${RELEASE_TAG}" = "${newest_tag}" ]; then
              tags+=("${IMAGE_NAME}:latest")
            else
              echo "::notice::${RELEASE_TAG} is older than ${newest_tag}; leaving :latest untouched"
            fi
          else
            echo "::notice::no release tag for ${SOURCE_SHA}; publishing the sha tag only"
          fi
          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Resolve package version
        id: package-version
        env:
          RELEASE_TAG: ${{ steps.release-metadata.outputs.release-tag }}
          SOURCE_SHA: ${{ steps.release-metadata.outputs.source-sha }}
        run: |
          if [[ "${RELEASE_TAG}" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            version="${RELEASE_TAG#v}"
          else
            version="0.0.1+sha.${SOURCE_SHA:0:12}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build candidate image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: ${{ steps.image-tags.outputs.tags }}
          build-args: |
            PACKAGE_VERSION=${{ steps.package-version.outputs.version }}
            SOURCE_COMMIT=${{ steps.release-metadata.outputs.source-sha }}

      - name: Verify candidate runtime contract
        env:
          IMAGE_TAGS: ${{ steps.image-tags.outputs.tags }}
        run: |
          candidate="$(printf '%s\n' "${IMAGE_TAGS}" | head -n 1)"
          uv run --locked python -m scripts.release_contract --image "${candidate}"

      - name: Scan candidate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:sha-${{ steps.release-metadata.outputs.source-sha }}
          scanners: vuln
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Publish tested image
        env:
          IMAGE_TAGS: ${{ steps.image-tags.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "${tag}" ] && docker push "${tag}"
          done <<< "${IMAGE_TAGS}"
