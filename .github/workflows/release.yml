name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancellable: this workflow cuts releases and publishes containers, and
# a second push to main must not abort an in-flight one.  Queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Nothing may be published from a commit whose CI has not passed.  The
  # container workflow has no trigger of its own, so this poll is the only gate
  # in front of it and replaces the `workflow_run` conclusion check that the
  # container workflow used to perform for itself.
  wait-for-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - name: Wait for CI to conclude on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          deadline="$(( $(date +%s) + 2400 ))"
          while :; do
            state="$(gh api \
              "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${HEAD_SHA}&per_page=100" \
              --jq 'if (.workflow_runs | length) == 0 then "pending" else
                      (.workflow_runs | sort_by(.run_number) | last
                       | if .status != "completed" then "pending"
                         elif .conclusion == "success" then "success"
                         else "failed with " + (.conclusion // "null") + " at " + .html_url
                         end)
                    end')"
            case "${state}" in
              success)
                echo "CI succeeded for ${HEAD_SHA}"
                exit 0
                ;;
              pending)
                ;;
              *)
                echo "::error::CI ${state}"
                exit 1
                ;;
            esac
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::timed out waiting for CI on ${HEAD_SHA}"
              exit 1
            fi
            sleep 20
          done

  # release-please runs with the default GITHUB_TOKEN, so the release it
  # publishes cannot trigger another workflow.  This workflow therefore calls
  # the container workflow directly and is its single entry point: a second
  # publishing path for the same commit would build a second, different digest
  # and the two runs would race for `:latest` and for the tag that the
  # attestation subject is resolved from.
  #
  # An empty release_tag means "no release on this commit"; the container
  # workflow then publishes the immutable sha tag only and leaves `:latest` and
  # the version tags pointing where they already point.
  publish-container:
    needs: [release-please, wait-for-ci]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/container.yml
    with:
      release_tag: ${{ needs.release-please.outputs.tag-name }}
