[project]
name = "enji-guard-cli"
dynamic = ["version"]
description = "Command-line tools for Enji Guard."
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1,<1",
    "mcp[cli]>=1.28.1,<2",
    "tenacity>=9.1.2,<10",
    "typer>=0.27.0",
    "watchfiles>=1.2.0,<2",
]

[project.scripts]
enji-guard = "enji_guard_cli.delivery.cli:app"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/enji_guard_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-config --strict-markers -W error -m 'not docker'"
markers = [
    "docker: packaging-policy tests that shell out to `docker compose`; excluded by default, run via `just docker-tests`",
]
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
xfail_strict = true

[tool.ruff]
src = ["src", "scripts", "tests"]
line-length = 120
target-version = "py314"
extend-exclude = [".planning"]

[tool.ruff.lint]
explicit-preview-rules = true
extend-select = ["RUF100"]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "BLE",
    "UP",
    "C4",
    "PIE",
    "RET",
    "ISC",
    "RSE",
    "FLY",
    "FURB",
    "RUF",
    "PERF",
    "SIM",
    "PTH",
    "DTZ",
    "PGH",
    "PLE",
    "LOG",
    "G",
    "N818",
    "ARG",
    "S",
    "C90",
    "PLR09",
    "PLR17",
    "PLR2004",
]
ignore = ["ISC001", "S101", "S105"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "DTZ",
    "ARG",
    "PERF401",
    "PLR2004",
    "S",
]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src/enji_guard_cli", "scripts", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportAny = "error"
reportExplicitAny = "error"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
reportMissingParameterType = "error"
reportMissingTypeArgument = "none"
reportUnannotatedClassAttribute = "none"
reportUnusedCallResult = "none"
reportImplicitStringConcatenation = "none"
reportPrivateUsage = "none"

[tool.vulture]
paths = ["src/enji_guard_cli", "scripts", "tests"]
min_confidence = 80
ignore_decorators = [
    "@app.callback",
    "@app.command",
]

[tool.deptry]
known_first_party = ["enji_guard_cli"]
per_rule_ignores = { DEP004 = ["radon"] }

[tool.coverage.run]
source = ["src/enji_guard_cli"]
branch = true
sigterm = true

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2
# Ratchet only.  Measured 84.13% (branch coverage on) at the time this
# floor was introduced; raise it as coverage improves, never lower it.
fail_under = 83

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12.24",
    "basedpyright>=1.39.8",
    "deptry>=0.25",
    "openapi-spec-validator>=0.9.0",
    "pip-audit>=2.10.1",
    "pre-commit>=4.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7",
    "pytest-crap>=0.3.0",
    "pytest-xdist>=3.8.0",
    "radon>=6.0.1",
    "ruff>=0.15.22",
    "tach>=0.35",
    "vulture>=2.16",
]
